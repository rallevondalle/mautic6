# Nginx Reverse Proxy Configuration for Mautic 6
# Domain: mautic6.dubby.online
# Server IP: 136.144.169.138
#
# Installation Instructions:
# 1. Copy this file to: /etc/nginx/sites-available/mautic6.dubby.online
# 2. Create symlink: sudo ln -s /etc/nginx/sites-available/mautic6.dubby.online /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Reload nginx: sudo systemctl reload nginx
#
# SSL Certificate Setup (using Let's Encrypt):
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d mautic6.dubby.online
#
# After obtaining SSL certificate, uncomment the SSL sections below

